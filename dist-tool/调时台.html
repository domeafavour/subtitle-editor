<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字 membrane 调时台 · Subtitle Timing Toolkit</title>
<style>
:root{
  --bg:#12100e; --panel:#1c1917; --panel2:#252019; --line:#3a3226;
  --ink:#f0e9dc; --dim:#a89a83; --acc:#ffb347; --acc2:#7fc8a9;
  --bad:#e06c5a; --mono:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--mono);
  font-size:14px; line-height:1.6;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,179,71,.08), transparent),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.015) 31px 32px);
}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
header{margin-bottom:28px;border-bottom:2px solid var(--line);padding-bottom:20px}
h1{
  font-size:clamp(26px,5vw,44px); letter-spacing:-.02em; font-weight:800;
  background:linear-gradient(100deg,var(--acc) 20%,var(--acc2) 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{color:var(--dim);margin-top:6px;font-size:13px}
.badge{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:3px;
  padding:1px 8px;font-size:11px;margin-left:10px;vertical-align:middle}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.panel h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input[type=number],select,input[type=text]{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:8px 10px;border-radius:5px;font-family:var(--mono);font-size:14px;
}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
button{
  background:var(--acc);color:#1a1208;border:none;border-radius:5px;
  padding:10px 16px;font-family:var(--mono);font-weight:700;font-size:13px;
  cursor:pointer;transition:transform .08s,filter .15s;width:100%;margin-top:14px;
}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
button.ghost:hover{color:var(--ink);border-color:var(--dim)}
button.mini{width:auto;margin:0;padding:5px 12px;font-size:12px}
.drop{
  border:2px dashed var(--line);border-radius:8px;padding:26px 14px;text-align:center;
  color:var(--dim);cursor:pointer;transition:.2s;margin-bottom:4px;
}
.drop.on{border-color:var(--acc);background:rgba(255,179,71,.07);color:var(--acc)}
.fileinfo{font-size:12px;color:var(--acc2);margin-top:8px;min-height:1em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.1em;position:sticky;top:0;background:var(--panel)}
td{padding:5px 8px;border-bottom:1px solid rgba(58,50,38,.5);vertical-align:top}
td.t{white-space:nowrap;color:var(--acc2)}
td input[type=text]{padding:4px 8px;font-size:13px;background:transparent;border:1px solid transparent}
td input[type=text]:hover{border-color:var(--line)}
td input[type=text]:focus{border-color:var(--acc);background:var(--panel2)}
.tblbox{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.stats{font-size:12px;color:var(--dim)}
.warn{color:var(--bad);font-size:12px;margin-top:8px;min-height:1em}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{margin-top:0}
footer{margin-top:40px;color:var(--dim);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--acc)}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--acc2);color:#0d1a14;padding:10px 22px;border-radius:6px;font-weight:700;
  transition:transform .25s;font-size:13px;z-index:9;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏱ 调时台 <span class="badge">SRT / VTT</span></h1>
    <p class="tagline">批量平移 · 速率缩放 · 逐行微调 · 一键导出 — 纯本地运行,字幕永不离开你的电脑</p>
  </header>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>① 载入字幕</h2>
        <div class="drop" id="drop">拖入 .srt / .vtt 文件<br>或点击选择</div>
        <input type="file" id="file" accept=".srt,.vtt,.txt" class="hidden">
        <div class="fileinfo" id="fileinfo"></div>
        <label>或直接粘贴:</label>
        <textarea id="paste" rows="5" style="width:100%;background:var(--panel2);border:1px solid var(--line);
          color:var(--ink);padding:8px;border-radius:5px;font-family:var(--mono);font-size:12px"
          placeholder="1&#10;00:00:01,000 --> 00:00:03,500&#10;你好"></textarea>
        <button class="ghost" id="parsePaste">解析粘贴内容</button>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2>② 批量调时</h2>
        <label>平移(秒,正=后移)</label>
        <input type="number" id="shift" step="0.001" value="0">
        <label>速率缩放(1.000 = 不变;如原片 23.976→25fps 填 1.0427)</label>
        <input type="number" id="scale" step="0.0001" value="1">
        <label>锚点(缩放的零点,秒)</label>
        <input type="number" id="anchor" step="0.001" value="0">
        <div class="row2">
          <button id="apply">应用到全部</button>
          <button class="ghost" id="preview" style="margin-top:0">预览</button>
        </div>
        <div class="warn" id="warn"></div>
        <label>分割行数(按时长拆分长字幕)</label>
        <div class="row2">
          <input type="number" id="splitN" min="2" max="10" value="2">
          <button class="ghost" id="splitBtn" style="margin-top:0">拆分选中行</button>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2>③ 导出</h2>
        <div class="actions">
          <button id="expSrt">SRT</button>
          <button id="expVtt">VTT</button>
          <button id="expTxt">TXT</button>
        </div>
        <div class="stats" id="stats" style="margin-top:10px"></div>
      </div>
    </div>

    <div class="panel">
      <h2>④ 字幕列表 <span id="count" style="color:var(--dim)"></span></h2>
      <div class="toolbar">
        <button class="mini ghost" id="addRow">+ 加一行</button>
        <button class="mini ghost" id="delSel">− 删除选中</button>
        <button class="mini ghost" id="undo">↩ 撤销</button>
        <div class="spacer"></div>
        <span class="stats">点击行可选中;时间列可直接编辑</span>
      </div>
      <div class="tblbox">
        <table id="tbl">
          <thead><tr><th style="width:34px"></th><th style="width:30px">#</th>
            <th style="width:110px">开始</th><th style="width:110px">结束</th><th>文本</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>
    调时台 v1.0 — 单文件工具,数据全程本地处理 ·
    <a href="https://afdian.com/a/tiaoshitai" target="_blank" rel="noopener">☕ 请作者喝杯茶</a>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ---------- state ----------
let subs = [];          // {startMs,endMs,text}
let selected = new Set();
let undoStack = [];
let curName = "subtitles";

const $ = id => document.getElementById(id);
const pad = (n,w=2) => String(n).padStart(w,"0");
const fmt = ms => { const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),
  s=Math.floor(ms%60000/1000),x=ms%1000; return `${pad(h)}:${pad(m)}:${pad(s)},${pad(x,3)}`; };
const fmtV = ms => fmt(ms).replace(",", ".");
const toast = msg => { const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); };
const pushUndo = () => { undoStack.push(JSON.stringify(subs)); if(undoStack.length>100) undoStack.shift(); };

// ---------- parsing ----------
const TS = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;

function parseSubtitleText(raw){
  const lines = raw.replace(/\r\n?/g,"\n").replace(/^\uFEFF/,"").split("\n");
  const out = [];
  let i = 0;
  const toMs = (h,m,s,x) => ((+h)*3600 + (+m)*60 + (+s))*1000 + +String(x).padEnd(3,"0");
  while(i < lines.length){
    const m = lines[i].match(TS);
    if(m){
      const startMs = toMs(m[1],m[2],m[3],m[4]), endMs = toMs(m[5],m[6],m[7],m[8]);
      i++;
      const body = [];
      while(i < lines.length && lines[i].trim() !== "" && !lines[i].match(TS)){
        body.push(lines[i].trim()); i++;
      }
      if(body.length) out.push({startMs,endMs,text:body.join("\n")});
      continue;
    }
    i++;
  }
  return out;
}

// ---------- rendering ----------
function render(){
  const tb = $("tbody"); tb.innerHTML = "";
  subs.forEach((s,i)=>{
    const tr = document.createElement("tr");
    if(selected.has(i)) tr.style.background="rgba(255,179,71,.10)";
    tr.innerHTML = `
      <td><input type="checkbox" ${selected.has(i)?"checked":""} data-sel="${i}"></td>
      <td style="color:var(--dim)">${i+1}</td>
      <td class="t"><input type="text" value="${fmt(s.startMs)}" data-f="startMs" data-i="${i}" size="11"></td>
      <td class="t"><input type="text" value="${fmt(s.endMs)}" data-f="endMs" data-i="${i}" size="11"></td>
      <td><input type="text" value="${s.text.replaceAll('"','&quot;')}" data-f="text" data-i="${i}"></td>`;
    tb.appendChild(tr);
  });
  $("count").textContent = subs.length ? `· ${subs.length} 行` : "";
  $("stats").textContent = subs.length
    ? `${subs.length} 行 · 总时长 ${( (subs.at(-1).endMs)/1000 ).toFixed(1)}s`
    : "尚未载入字幕";
}

function loadParsed(list, name){
  if(!list.length){ $("warn").textContent = "未解析出任何字幕行,请检查格式。"; return; }
  $("warn").textContent = "";
  pushUndo();
  subs = list; selected.clear(); curName = (name||"subtitles").replace(/\.[^.]+$/,"");
  $("fileinfo").textContent = `✓ 已载入 ${list.length} 行`;
  render(); toast(`已载入 ${list.length} 行字幕`);
}

// ---------- transform ----------
function transform(list, shiftSec, scale, anchorSec){
  const a = anchorSec*1000;
  return list.map(s=>({
    startMs: Math.max(0, Math.round(a + (s.startMs-a)*scale + shiftSec*1000)),
    endMs:   Math.max(1, Math.round(a + (s.endMs-a)*scale + shiftSec*1000)),
    text: s.text,
  }));
}

// ---------- events ----------
$("drop").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; if(f) readFile(f); e.target.value=""; };
function readFile(f){
  const r = new FileReader();
  r.onload = () => loadParsed(parseSubtitleText(r.result), f.name);
  r.readAsText(f, "UTF-8");
}
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e=>{
  e.preventDefault(); $("drop").classList.add("on"); }));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e=>{
  e.preventDefault(); $("drop").classList.remove("on"); }));
$("drop").addEventListener("drop", e=>{
  const f = e.dataTransfer.files[0]; if(f) readFile(f);
});
$("parsePaste").onclick = () => loadParsed(parseSubtitleText($("paste").value), "pasted");

$("preview").onclick = () => {
  const sh=+$("shift").value||0, sc=+$("scale").value||1, an=+$("anchor").value||0;
  if(!subs.length){ $("warn").textContent="请先载入字幕。"; return; }
  const t = transform(subs.slice(0,3), sh, sc, an);
  $("warn").innerHTML = "预览前 3 行:<br>" + t.map((s,i)=>
    `${fmt(s.startMs)} --> ${fmt(s.endMs)} ${subs[i].text.slice(0,12)}`).join("<br>");
};

$("apply").onclick = () => {
  if(!subs.length){ $("warn").textContent="请先载入字幕。"; return; }
  const sh=+$("shift").value||0, sc=+$("scale").value||1, an=+$("anchor").value||0;
  if(sc<=0){ $("warn").textContent="缩放速率必须大于 0。"; return; }
  pushUndo();
  subs = transform(subs, sh, sc, an);
  render(); toast("已应用到全部行");
};

$("splitBtn").onclick = () => {
  const n = Math.max(2, Math.min(10, +$("splitN").value||2));
  const idx = [...selected].sort((a,b)=>a-b);
  if(!idx.length){ $("warn").textContent="请先勾选要拆分的行。"; return; }
  pushUndo();
  const out = [];
  subs.forEach((s,i)=>{
    if(!idx.includes(i)){ out.push(s); return; }
    const dur = (s.endMs - s.startMs)/n;
    const parts = s.text.split(/\n+/).flatMap(x=>x.split(/(?<=[。!?;.!?])\s*/)).filter(Boolean);
    for(let k=0;k<n;k++){
      out.push({ startMs: Math.round(s.startMs+dur*k),
                 endMs: Math.round(s.startMs+dur*(k+1)),
                 text: parts.length===n ? parts[k] : s.text });
    }
  });
  subs = out; selected.clear(); render(); toast("已拆分");
};

$("addRow").onclick = () => {
  pushUndo();
  const last = subs.at(-1);
  const start = last ? last.endMs + 200 : 0;
  subs.push({startMs:start, endMs:start+2000, text:"新字幕"});
  render();
};
$("delSel").onclick = () => {
  if(!selected.size) return;
  pushUndo();
  subs = subs.filter((_,i)=>!selected.has(i));
  selected.clear(); render(); toast("已删除选中行");
};
$("undo").onclick = () => {
  const prev = undoStack.pop();
  if(prev){ subs = JSON.parse(prev); selected.clear(); render(); toast("已撤销"); }
  else toast("没有可撤销的操作");
};

$("tbody").addEventListener("change", e=>{
  const i = e.target.dataset.sel;
  if(i!==undefined){ +i in [...selected] ? null : null;
    if(e.target.checked) selected.add(+i); else selected.delete(+i);
    render(); }
});
$("tbody").addEventListener("focusin", e=>{ e.target._v = e.target.value; });
$("tbody").addEventListener("change", e=>{
  const f = e.target.dataset.f, i = +e.target.dataset.i;
  if(!f || !(i in subs)) return;
  if(e.target.value === e.target._v) return;
  pushUndo();
  const s = subs[i];
  if(f==="text"){ s.text = e.target.value; }
  else{
    const m = e.target.value.trim().match(/^(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})$/);
    if(!m){ toast("时间格式应为 HH:MM:SS,mmm"); render(); return; }
    const ms = ((+m[1])*3600 + (+m[2])*60 + (+m[3]))*1000 + +m[4].padEnd(3,"0");
    s[f] = ms;
    if(s.endMs <= s.startMs){ toast("结束时间需晚于开始时间"); render(); return; }
  }
  render();
});

// ---------- export ----------
function dl(name, content){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type:"text/plain;charset=utf-8"}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 0);
}
$("expSrt").onclick = () => {
  if(!subs.length) return toast("请先载入字幕");
  dl(`${curName}.srt`, subs.map((s,i)=>`${i+1}\r\n${fmt(s.startMs)} --> ${fmt(s.endMs)}\r\n${s.text.replace(/\n/g,"\r\n")}`).join("\r\n\r\n")+"\r\n");
  toast("已导出 SRT");
};
$("expVtt").onclick = () => {
  if(!subs.length) return toast("请先载入字幕");
  dl(`${curName}.vtt`, "WEBVTT\r\n\r\n" + subs.map((s,i)=>`${i+1}\r\n${fmtV(s.startMs)} --> ${fmtV(s.endMs)}\r\n${s.text.replace(/\n/g,"\r\n")}`).join("\r\n\r\n")+"\r\n");
  toast("已导出 VTT");
};
$("expTxt").onclick = () => {
  if(!subs.length) return toast("请载入字幕");
  dl(`${curName}.txt`, subs.map(s=>s.text).join("\n")+"\n");
  toast("已导出纯文本");
};
</script>
</body>
</html>
